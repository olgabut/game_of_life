<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Game of Life</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>THE GAME OF LIFE</h1>

  <div class="controls">
    <label>
      Width
      <input type="number" id="width" min="0" max="100" value="10">
    </label>
    <label>
      Height
      <input type="number" id="height" min="0" max="100" value="10">
    </label>
    <label class="speed">
      Speed
      <input type="range" id="speed" min="0" max="5" step="0.5" value="5">
      <output id="speed-value" for="speed"></output>
    </label>
    <label class="predict">
      <input type="checkbox" id="predict">
      Predict
    </label>
    <button type="button" id="toggle" class="toggle">Start</button>
  </div>

  <p class="generation">Generation: <span id="generation">0</span></p>

  <div class="board">
    <div id="matrix" class="matrix"></div>
    <div id="prediction" class="prediction" aria-hidden="true"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
